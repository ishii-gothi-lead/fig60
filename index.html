<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fig 60 - MAE-B Micro Video Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #f3f4f6;
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 24px 24px;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .workbench {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 0.5rem;
        }

        header h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: #111827;
            margin-bottom: 0.25rem;
        }

        header p {
            font-size: 0.8rem;
            font-weight: 700;
            color: #0284c7;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        .video-container {
            background: #ffffff;
            border: 2px dashed #cbd5e1;
            border-radius: 20px;
            padding: 1.75rem 1.5rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.25rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .video-container p {
            font-size: 1.1rem;
            font-weight: 600;
            color: #334155;
        }

        #videoPlayer {
            width: 100%;
            max-height: 320px;
            border-radius: 12px;
            background: #000000;
            display: none;
            outline: none;
        }

        .compliance-badge {
            font-size: 0.75rem;
            font-weight: 600;
            color: #0369a1;
            background: rgba(2, 132, 199, 0.08);
            padding: 0.4rem 0.9rem;
            border-radius: 9999px;
            border: 1px solid rgba(2, 132, 199, 0.2);
        }

        .file-upload-wrapper {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 16px;
        }

        .file-upload-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 10;
        }

        .mae-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 56px;
            padding: 0 1.5rem;
            background-color: #0284c7;
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 700;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
        }

        .mae-button:hover:not(:disabled) {
            background-color: #0369a1;
            transform: translateY(-1px);
        }

        .mae-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        .mae-button-secondary {
            background-color: #f8fafc;
            color: #1e293b;
            border: 1px solid #cbd5e1;
            box-shadow: none;
            font-size: 0.95rem;
        }

        .controls-container {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 1.75rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .workspace-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Version Stack List Styling */
        .version-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 180px;
            overflow-y: auto;
        }

        .version-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #334155;
        }

        .version-actions {
            display: flex;
            gap: 0.5rem;
        }

        .version-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
        }

        .btn-load { color: #0284c7; }
        .btn-load:hover { background: rgba(2, 132, 199, 0.1); }
        .btn-delete { color: #dc2626; }
        .btn-delete:hover { background: rgba(220, 38, 38, 0.1); }

        #fileStatus {
            font-size: 0.85rem;
            color: #059669;
            font-weight: 600;
            display: none;
        }

        #actionStatus {
            font-size: 0.85rem;
            color: #0284c7;
            font-weight: 600;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <main class="workbench">
        <header>
            <h1>Fig 60</h1>
            <p>MAE-B • Micro Video Engine</p>
        </header>

        <!-- Video Display Workspace -->
        <div class="video-container">
            <p id="instructionText">Click to Load Local Video</p>
            <video id="videoPlayer" controls playsinline preload="auto"></video>
            <span id="fileStatus"></span>
            <span class="compliance-badge">MAE-B Compliance Active (56px)</span>
            
            <div class="file-upload-wrapper">
                <button class="mae-button" id="selectButton">Select Local Video</button>
                <input type="file" id="fileInput" accept="video/mp4,video/quicktime,video/*">
            </div>
        </div>

        <!-- Manual Trim Point Controls -->
        <div class="controls-container">
            <div class="workspace-label">Manual Trim Points</div>
            <div class="button-grid">
                <button class="mae-button mae-button-secondary" id="setStartBtn" disabled>Set Start (00:00.0)</button>
                <button class="mae-button mae-button-secondary" id="setEndBtn" disabled>Set End (00:00.0)</button>
            </div>
        </div>

        <!-- Editing Actions -->
        <div class="controls-container">
            <div class="workspace-label">Editing Actions</div>
            <button class="mae-button" id="saveVersionBtn" style="background-color: #475569;" disabled>Save as New Edited Version</button>
            <span id="actionStatus"></span>
        </div>

        <!-- Version History Stack Panel -->
        <div class="controls-container">
            <div class="workspace-label">Version History Stack</div>
            <div id="versionListContainer" class="version-list">
                <p style="font-size: 0.85rem; color: #94a3b8; text-align: center; padding: 0.5rem;">No versions saved yet.</p>
            </div>
        </div>
    </main>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileStatus = document.getElementById('fileStatus');
        const instructionText = document.getElementById('instructionText');
        const selectButton = document.getElementById('selectButton');
        const videoPlayer = document.getElementById('videoPlayer');

        const setStartBtn = document.getElementById('setStartBtn');
        const setEndBtn = document.getElementById('setEndBtn');
        const saveVersionBtn = document.getElementById('saveVersionBtn');
        const actionStatus = document.getElementById('actionStatus');
        const versionListContainer = document.getElementById('versionListContainer');

        let startTime = 0;
        let endTime = 0;
        let versions = []; // Stack to hold original + edited versions

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = (seconds % 60).toFixed(1);
            return `${mins.toString().padStart(2, '0')}:${secs.padStart(4, '0')}`;
        }

        // Render the Version Stack UI
        function renderVersionList() {
            if (versions.length === 0) {
                versionListContainer.innerHTML = `<p style="font-size: 0.85rem; color: #94a3b8; text-align: center; padding: 0.5rem;">No versions saved yet.</p>`;
                return;
            }

            versionListContainer.innerHTML = '';
            versions.forEach((ver, index) => {
                const item = document.createElement('div');
                item.className = 'version-item';
                item.innerHTML = `
                    <span>${ver.name}</span>
                    <div class="version-actions">
                        <button class="version-btn btn-load" onclick="loadVersion(${index})">Load</button>
                        <button class="version-btn btn-load" onclick="downloadVersion(${index})">Download</button>
                        ${index > 0 ? `<button class="version-btn btn-delete" onclick="deleteVersion(${index})">Delete</button>` : ''}
                    </div>
                `;
                versionListContainer.appendChild(item);
            });
        }

        // Load specific version into player
        window.loadVersion = function(index) {
            const ver = versions[index];
            videoPlayer.src = ver.url;
            videoPlayer.load();
            actionStatus.textContent = `Loaded "${ver.name}" into player.`;
            actionStatus.style.display = 'block';
        };

        // Download specific version file
        window.downloadVersion = function(index) {
            const ver = versions[index];
            const a = document.createElement('a');
            a.href = ver.url;
            a.download = `${ver.name.toLowerCase().replace(/\s+/g, '-')}.mp4`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };

        // Delete an edited version
        window.deleteVersion = function(index) {
            if (index === 0) return; // Prevent deleting original
            versions.splice(index, 1);
            renderVersionList();
            actionStatus.textContent = `Deleted version.`;
            actionStatus.style.display = 'block';
        };

        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const videoURL = URL.createObjectURL(file);
                
                // Reset versions stack with the new Original file
                versions = [{
                    name: "Original Video",
                    url: videoURL,
                    file: file
                }];

                videoPlayer.src = videoURL;
                videoPlayer.style.display = 'block';
                videoPlayer.load();

                instructionText.style.display = 'none';
                fileStatus.textContent = `Loaded: ${file.name} (${(file.size / (1024 * 1024)).toFixed(1)} MB)`;
                fileStatus.style.display = 'block';
                selectButton.textContent = "Change Video";

                // Enable controls
                setStartBtn.disabled = false;
                setEndBtn.disabled = false;
                saveVersionBtn.disabled = false;
                actionStatus.style.display = 'none';

                renderVersionList();
            }
        });

        setStartBtn.addEventListener('click', () => {
            startTime = videoPlayer.currentTime;
            setStartBtn.textContent = `Start: ${formatTime(startTime)}`;
            actionStatus.textContent = `Start point set at ${formatTime(startTime)}`;
            actionStatus.style.display = 'block';
        });

        setEndBtn.addEventListener('click', () => {
            endTime = videoPlayer.currentTime;
            setEndBtn.textContent = `End: ${formatTime(endTime)}`;
            actionStatus.textContent = `End point set at ${formatTime(endTime)}`;
            actionStatus.style.display = 'block';
        });

        saveVersionBtn.addEventListener('click', () => {
            if (versions.length === 0) return;

            const editCount = versions.length; // Edit 1, Edit 2, etc.
            const newVersionName = `Edit Version ${editCount}`;
            
            // For client-side preview/stacking, we duplicate the active stream or current source reference
            // Future cuts can be mapped to custom segment blobs here.
            versions.push({
                name: newVersionName,
                url: videoPlayer.src,
                range: { start: startTime, end: endTime }
            });

            renderVersionList();
            actionStatus.textContent = `Successfully saved "${newVersionName}" to your history stack!`;
            actionStatus.style.display = 'block';
        });
    </script>
</body>
</html>

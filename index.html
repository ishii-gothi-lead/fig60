<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fig 60 - MAE-B Micro Video Engine</title>
    <!-- Modern Print-Style Typography (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* Base Reset & Light Editorial Theme */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: #f3f4f6;
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 24px 24px;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        /* Unified Single-Column Workbench Layout */
        .workbench {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }

        /* Header Section - Prominent Editorial Masthead */
        header {
            text-align: center;
            margin-bottom: 0.75rem;
        }

        header h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: #111827;
            margin-bottom: 0.25rem;
            line-height: 1.05;
        }

        header p {
            font-size: 0.8rem;
            font-weight: 700;
            color: #0284c7;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        /* Video Workspace Container */
        .video-container {
            background: #ffffff;
            border: 2px dashed #cbd5e1;
            border-radius: 20px;
            padding: 1.75rem 1.5rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        .video-container p {
            font-size: 1.1rem;
            font-weight: 600;
            color: #334155;
            letter-spacing: -0.01em;
        }

        #videoPlayer {
            width: 100%;
            max-height: 320px;
            border-radius: 12px;
            background: #000000;
            display: none;
            object-fit: contain;
            outline: none;
        }

        .compliance-badge {
            font-size: 0.75rem;
            font-weight: 600;
            color: #0369a1;
            background: rgba(2, 132, 199, 0.08);
            padding: 0.4rem 0.9rem;
            border-radius: 9999px;
            border: 1px solid rgba(2, 132, 199, 0.2);
            letter-spacing: 0.02em;
        }

        /* Bulletproof File Picker Wrapper */
        .file-upload-wrapper {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 16px;
        }

        .file-upload-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 10;
        }

        /* MAE-B Baseline Compliant Targets (56px+ height) */
        .mae-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 56px;
            padding: 0 1.5rem;
            background-color: #0284c7;
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
        }

        .mae-button:hover:not(:disabled) {
            background-color: #0369a1;
            transform: translateY(-1px);
        }

        .mae-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Controls Panel */
        .controls-container {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 1.75rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        .workspace-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.15rem;
        }

        #fileStatus {
            font-size: 0.85rem;
            color: #059669;
            font-weight: 600;
            display: none;
        }

        #processingStatus {
            font-size: 0.85rem;
            color: #0284c7;
            font-weight: 600;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <main class="workbench">
        <header>
            <h1>Fig 60</h1>
            <p>MAE-B • Micro Video Engine</p>
        </header>

        <!-- Video Workspace / Dropzone -->
        <div class="video-container">
            <p id="instructionText">Click to Load Local Video</p>
            
            <video id="videoPlayer" controls playsinline preload="auto"></video>
            
            <span id="fileStatus"></span>
            <span class="compliance-badge">MAE-B Compliance Active (56px)</span>
            
            <div class="file-upload-wrapper">
                <button class="mae-button" id="selectButton">Select Local Video</button>
                <input type="file" id="fileInput" accept="video/mp4,video/quicktime,video/*">
            </div>
        </div>

        <!-- Start Time Control -->
        <div class="controls-container">
            <div class="workspace-label">Start Time</div>
            <button class="mae-button" id="setStartTimeBtn" style="background-color: #f8fafc; color: #1e293b; border: 1px solid #cbd5e1; box-shadow: none;" disabled>Set Current Time as Start (00:00.0)</button>
        </div>

        <!-- Actions Panel -->
        <div class="controls-container">
            <div class="workspace-label">Actions</div>
            <button class="mae-button" id="trimBtn" style="background-color: #475569;" disabled>Trim 60s Clip</button>
            <button class="mae-button" id="saveBtn" style="background-color: #059669; box-shadow: 0 4px 12px rgba(5, 150, 105, 0.2);" disabled>Save Local Copy</button>
            <span id="processingStatus">Processing trim... Please wait.</span>
        </div>
    </main>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileStatus = document.getElementById('fileStatus');
        const instructionText = document.getElementById('instructionText');
        const selectButton = document.getElementById('selectButton');
        const videoPlayer = document.getElementById('videoPlayer');

        const setStartTimeBtn = document.getElementById('setStartTimeBtn');
        const trimBtn = document.getElementById('trimBtn');
        const saveBtn = document.getElementById('saveBtn');
        const processingStatus = document.getElementById('processingStatus');

        let startTimeSeconds = 0;
        let trimmedBlob = null;

        // Format seconds into MM:SS.S
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = (seconds % 60).toFixed(1);
            return `${mins.toString().padStart(2, '0')}:${secs.padStart(4, '0')}`;
        }

        // Handle Video Load
        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                if (videoPlayer.src) {
                    URL.revokeObjectURL(videoPlayer.src);
                }

                const videoURL = URL.createObjectURL(file);
                videoPlayer.src = videoURL;
                videoPlayer.style.display = 'block';
                videoPlayer.load();

                instructionText.style.display = 'none';
                fileStatus.textContent = `Loaded: ${file.name} (${(file.size / (1024 * 1024)).toFixed(1)} MB)`;
                fileStatus.style.display = 'block';
                selectButton.textContent = "Change Video";

                // Enable buttons once video is loaded
                setStartTimeBtn.disabled = false;
                trimBtn.disabled = false;
                saveBtn.disabled = true; // Enabled after trimming
                startTimeSeconds = 0;
                setStartTimeBtn.textContent = `Set Current Time as Start (00:00.0)`;
            }
        });

        // 1. Set Start Time Action
        setStartTimeBtn.addEventListener('click', function() {
            startTimeSeconds = videoPlayer.currentTime;
            setStartTimeBtn.textContent = `Start Time Set: ${formatTime(startTimeSeconds)}`;
        });

        // 2. Trim 60s Clip Action using Canvas & MediaRecorder
        trimBtn.addEventListener('click', async function() {
            if (!videoPlayer.src) return;

            processingStatus.style.display = 'block';
            trimBtn.disabled = true;

            // Prepare Canvas
            const canvas = document.createElement('canvas');
            canvas.width = videoPlayer.videoWidth || 1280;
            canvas.height = videoPlayer.videoHeight || 720;
            const ctx = canvas.getContext('2d');

            // Capture stream from Canvas
            const stream = canvas.captureStream(30); // 30 FPS
            const mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            const chunks = [];

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) chunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                trimmedBlob = new Blob(chunks, { type: 'video/webm' });
                processingStatus.style.display = 'none';
                trimBtn.disabled = false;
                saveBtn.disabled = false;
                alert('60-second clip trimmed successfully! Click "Save Local Copy" to download.');
            };

            // Jump to start time and play
            videoPlayer.currentTime = startTimeSeconds;
            await videoPlayer.play();
            mediaRecorder.start();

            const durationToRecord = Math.min(60, videoPlayer.duration - startTimeSeconds);
            const startTimeMs = Date.now();

            function drawFrame() {
                const elapsed = (Date.now() - startTimeMs) / 1000;
                if (elapsed >= durationToRecord || videoPlayer.ended) {
                    videoPlayer.pause();
                    mediaRecorder.stop();
                    return;
                }
                ctx.drawImage(videoPlayer, 0, 0, canvas.width, canvas.height);
                requestAnimationFrame(drawFrame);
            }

            drawFrame();
        });

        // 3. Save Local Copy Action
        saveBtn.addEventListener('click', function() {
            if (!trimmedBlob) return;

            const downloadUrl = URL.createObjectURL(trimmedBlob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = `fig60-trimmed-${Date.now()}.webm`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(downloadUrl);
        });
    </script>
</body>
</html>

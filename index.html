<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fig 60 — Micro-Video Canvas</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --text: #f0f6fc;
      --accent: #238636;
      --border: #30363d;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .container {
      max-width: 500px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2rem;
      box-sizing: border-box;
      text-align: center;
    }
    h1 {
      margin-top: 0;
      font-size: 1.8rem;
    }
    p {
      color: #8b949e;
      font-size: 0.95rem;
    }
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 6px;
      padding: 2rem 1rem;
      margin: 1.5rem 0;
      cursor: pointer;
      transition: border-color 0.2s ease;
    }
    .drop-zone:hover {
      border-color: var(--accent);
    }
    input[type="file"] {
      display: none;
    }
    video {
      width: 100%;
      max-height: 400px;
      border-radius: 6px;
      margin-top: 1rem;
      display: none;
      background: #000;
    }
    #status {
      margin-top: 1rem;
      font-weight: 500;
      color: #58a6ff;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Fig 60</h1>
    <p>60 seconds for pure intent. Zero servers, client-side Wasm transcoding.</p>

    <div class="drop-zone" id="dropZone">
      <p>Click or drag a video file here to transcode</p>
      <input type="file" id="videoInput" accept="video/*">
    </div>

    <div id="status"></div>
    <video id="previewPlayer" controls></video>
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const videoInput = document.getElementById('videoInput');
    const previewPlayer = document.getElementById('previewPlayer');
    const status = document.getElementById('status');

    dropZone.addEventListener('click', () => videoInput.click());

    videoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        startTranscode(file);
      }
    });

    function startTranscode(file) {
      status.textContent = `Preparing ${file.name}...`;

      // Initialize the Web Worker
      const worker = new Worker('worker.js', { type: 'module' });

      worker.postMessage({ type: 'TRANSCODE', file });

      worker.onmessage = (e) => {
        const { status: workerStatus, message, videoUrl } = e.data;
        
        if (workerStatus === 'LOADING' || workerStatus === 'PROCESSING' || workerStatus === 'LOG') {
          status.textContent = message;
        } else if (workerStatus === 'DONE') {
          status.textContent = message;
          previewPlayer.src = videoUrl;
          previewPlayer.style.display = 'block';
          worker.terminate();
        }
      };

      worker.onerror = (err) => {
        console.error(err);
        status.textContent = 'Transcoding error. Check console.';
      };
    }
  </script>
</body>
</html>

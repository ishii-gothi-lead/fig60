<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fig 60 - MAE-B Micro Video Engine</title>
    <!-- Modern Print-Style Typography (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* Base Reset & Light Editorial Theme */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: #f3f4f6;
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 24px 24px;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        /* Clean Single-Column Workbench Layout */
        .workbench {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }

        /* Header Section - Prominent Editorial Masthead */
        header {
            text-align: center;
            margin-bottom: 0.75rem;
        }

        header h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: #111827;
            margin-bottom: 0.25rem;
            line-height: 1.05;
        }

        header p {
            font-size: 0.8rem;
            font-weight: 700;
            color: #0284c7;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        /* Video Workspace Container - Soft Edges & Rounded Corners */
        .video-container {
            background: #ffffff;
            border: 2px dashed #cbd5e1;
            border-radius: 20px;
            padding: 2.75rem 1.5rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        .video-container p {
            font-size: 1.1rem;
            font-weight: 600;
            color: #334155;
            letter-spacing: -0.01em;
        }

        .compliance-badge {
            font-size: 0.75rem;
            font-weight: 600;
            color: #0369a1;
            background: rgba(2, 132, 199, 0.08);
            padding: 0.4rem 0.9rem;
            border-radius: 9999px;
            border: 1px solid rgba(2, 132, 199, 0.2);
            letter-spacing: 0.02em;
        }

        /* MAE-B Baseline Compliant Targets (56px+ height) with Soft Rounded Corners */
        .mae-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 56px;
            padding: 0 1.5rem;
            background-color: #0284c7;
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
        }

        .mae-button:hover {
            background-color: #0369a1;
            transform: translateY(-1px);
        }

        /* Controls Panel - Soft Edges & Rounded Corners */
        .controls-container {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 1.75rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        .workspace-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.15rem;
        }
    </style>
</head>
<body>

    <main class="workbench">
        <header>
            <h1>Fig 60</h1>
            <p>MAE-B • Micro Video Engine</p>
        </header>

        <!-- Video Workspace / Dropzone with Native Label Wrapper -->
        <div class="video-container">
            <p>Click to Load Local Video</p>
            <span class="compliance-badge">MAE-B Compliance Active (56px)</span>
            <label class="mae-button" style="cursor: pointer;">
                Select Local Video
                <input type="file" id="fileInput" accept="video/*" style="display: none;">
            </label>
        </div>

        <!-- Start Time Control -->
        <div class="controls-container">
            <div class="workspace-label">Start Time</div>
            <button class="mae-button" style="background-color: #f8fafc; color: #1e293b; border: 1px solid #cbd5e1; box-shadow: none;">00:00.0</button>
        </div>

        <!-- Actions Panel -->
        <div class="controls-container">
            <div class="workspace-label">Actions</div>
            <button class="mae-button" style="background-color: #475569;">Trim 60s Clip</button>
            <button class="mae-button" style="background-color: #059669; box-shadow: 0 4px 12px rgba(5, 150, 105, 0.2);">Save Local Copy</button>
        </div>
    </main>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fig 60 - MAE-B Micro Video Engine</title>
    <!-- Modern Print-Style Typography (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* Base Reset & Theme */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: #0b0f17;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        /* Original Single-Column Workbench Layout */
        .workbench {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        /* Header Section - Sharp Modern Print Styling */
        header {
            text-align: center;
            margin-bottom: 0.5rem;
        }

        header h1 {
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: #ffffff;
            margin-bottom: 0.35rem;
            line-height: 1.1;
        }

        header p {
            font-size: 0.75rem;
            font-weight: 700;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        /* Video Workspace Container (Modern Border & High Contrast) */
        .video-container {
            background: #111827;
            border: 2px dashed #1e3a8a;
            border-radius: 16px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .video-container p {
            font-size: 1.05rem;
            font-weight: 600;
            color: #f1f5f9;
            letter-spacing: -0.01em;
        }

        .compliance-badge {
            font-size: 0.75rem;
            font-weight: 600;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
            padding: 0.4rem 0.9rem;
            border-radius: 9999px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            letter-spacing: 0.02em;
        }

        /* MAE-B Baseline Buttons (Vibrant High-Contrast Print Styling) */
        .mae-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 56px;
            padding: 0 1.5rem;
            background-color: #0284c7;
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        .mae-button:hover {
            background-color: #0369a1;
            transform: translateY(-1px);
        }

        /* Controls Panel */
        .controls-container {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .workspace-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.25rem;
        }
    </style>
</head>
<body>

    <main class="workbench">
        <header>
            <h1>Fig 60</h1>
            <p>MAE-B • Micro Video Engine</p>
        </header>

        <!-- Video Workspace -->
        <div class="video-container">
            <p>Click to Load Local Video</p>
            <span class="compliance-badge">MAE-B Compliance Active (56px)</span>
            <button class="mae-button" onclick="document.getElementById('fileInput').click()">Select Local Video</button>
            <input type="file" id="fileInput" accept="video/*" style="display: none;">
        </div>

        <!-- Controls -->
        <div class="controls-container">
            <div class="workspace-label">Start Time</div>
            <button class="mae-button" style="background-color: #1e293b; color: #f8fafc; border: 1px solid #334155;">00:00.0</button>
        </div>
    </main>

</body>
</html>

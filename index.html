<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fig 60 - MAE-B Micro Video Engine</title>
    <style>
        /* Base Reset & Theme */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0d0f14;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        /* Mobile First Layout (Default Stack) */
        .workbench {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        /* Header Section */
        header {
            text-align: center;
            margin-bottom: 0.5rem;
        }

        header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: #ffffff;
            margin-bottom: 0.25rem;
        }

        header p {
            font-size: 0.85rem;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Video Workspace / Dropzone */
        .video-container {
            background: #161a23;
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 2rem 1.5rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 240px;
            gap: 1rem;
        }

        .video-container p {
            font-size: 0.95rem;
            color: #d1d5db;
        }

        .compliance-badge {
            font-size: 0.75rem;
            color: #60a5fa;
            background: rgba(96, 165, 250, 0.1);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
        }

        /* MAE-B Baseline Compliant Targets (56px+ height/padding) */
        .mae-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 56px;
            padding: 0 1.5rem;
            background-color: #2563eb;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            text-decoration: none;
        }

        .mae-button:hover {
            background-color: #1d4ed8;
        }

        /* Controls Panel */
        .controls-container {
            background: #161a23;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Desktop Polish (Side-by-Side Grid for Wider Screens) */
        @media (min-width: 900px) {
            .workbench {
                max-width: 1000px;
                display: grid;
                grid-template-columns: 1.2fr 1fr;
                gap: 2rem;
                align-items: center;
                background: rgba(255, 255, 255, 0.02);
                border: 1px solid rgba(255, 255, 255, 0.06);
                border-radius: 20px;
                padding: 2.5rem;
            }

            header {
                grid-column: 1 / -1;
                margin-bottom: 1rem;
            }

            .video-container {
                min-height: 320px;
            }
        }
    </style>
</head>
<body>

    <main class="workbench">
        <header>
            <h1>Fig 60</h1>
            <p>MAE-B • Micro Video Engine</p>
        </header>

        <!-- Video Preview / Loading Dropzone -->
        <div class="video-container">
            <p>Drag & drop local video here, or select below</p>
            <span class="compliance-badge">MAE-B Baseline Active (56px)</span>
            <button class="mae-button" onclick="document.getElementById('fileInput').click()">Select Local Video</button>
            <input type="file" id="fileInput" accept="video/*" style="display: none;">
        </div>

        <!-- Trimming & Editing Controls -->
        <div class="controls-container">
            <div style="font-size: 0.9rem; color: #9ca3af; margin-bottom: 0.5rem;">Edit Workspace</div>
            <button class="mae-button" style="background-color: #374151;">Trim 60s Clip</button>
            <button class="mae-button" style="background-color: #059669;">Save Local Copy</button>
        </div>
    </main>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fig 60 - MAE-B Micro Video Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #0f172a;
            background-image: radial-gradient(#1e293b 1.5px, transparent 1.5px);
            background-size: 28px 28px;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem;
            overflow-x: hidden;
            position: relative;
        }

        /* Top Studio Header & Controls Bar */
        .studio-topbar {
            width: 100%;
            max-width: 1300px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            z-index: 100;
        }

        header h1 {
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: #ffffff;
        }

        header p {
            font-size: 0.75rem;
            font-weight: 700;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        .topbar-actions {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .studio-btn {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 0.6rem 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .studio-btn:hover {
            background: #334155;
            color: #ffffff;
        }

        /* Infinite Floating Canvas Workbench (Desktop) / Static Stack (Mobile) */
        .workbench {
            position: relative;
            width: 100%;
            max-width: 1300px;
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        @media (min-width: 1024px) {
            .workbench {
                display: block; /* Enables absolute floating layout on desktop */
                height: 750px;
            }
        }

        /* Free-Floating Studio Containers */
        .floating-container {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            resize: both;
            overflow: hidden;
            transition: opacity 0.3s ease, box-shadow 0.2s ease;
            transform-origin: top left;
        }

        @media (min-width: 1024px) {
            .floating-container {
                position: absolute;
            }
        }

        /* Focus Mode: Dim background containers when interacting or zooming */
        .workbench.focus-active .floating-container:not(.focused) {
            opacity: 0.35;
        }
        .floating-container.focused {
            box-shadow: 0 0 0 2px #38bdf8, 0 25px 50px -12px rgba(0,0,0,0.7);
            z-index: 50 !important;
        }

        /* Container Header / Drag Handle */
        .container-header {
            background: #0f172a;
            padding: 0.65rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: grab;
            border-bottom: 1px solid #334155;
            user-select: none;
        }

        .container-header:active {
            cursor: grabbing;
        }

        .container-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .container-controls {
            display: flex;
            gap: 0.4rem;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 0.1rem 0.3rem;
            border-radius: 4px;
        }
        .icon-btn:hover { color: #ffffff; background: #334155; }

        .container-body {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            flex: 1;
            overflow-y: auto;
            height: calc(100% - 37px);
        }

        /* Specific Default Positions for Desktop Floating Canvas */
        #box-version-stack { width: 320px; height: 420px; top: 20px; left: 20px; z-index: 10; }
        #box-video-player  { width: 520px; height: 500px; top: 20px; left: 360px; z-index: 20; }
        #box-actions       { width: 380px; height: 260px; top: 460px; left: 20px; z-index: 15; }

        /* Video Workspace Styling */
        .video-dropzone {
            border: 2px dashed #475569;
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.85rem;
            background: rgba(15, 23, 42, 0.4);
            flex: 1;
            justify-content: center;
        }

        #videoPlayer {
            width: 100%;
            max-height: 240px;
            border-radius: 8px;
            background: #000000;
            display: none;
            outline: none;
        }

        .compliance-badge {
            font-size: 0.7rem;
            font-weight: 600;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            padding: 0.3rem 0.75rem;
            border-radius: 9999px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .compliance-badge:hover { background: rgba(56, 189, 248, 0.2); }

        /* Button Architecture with MAE-B Dynamic Scaling Support */
        .mae-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 1rem;
            background-color: #0284c7;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            text-align: center;
            text-decoration: none;
        }
        .mae-btn:hover:not(:disabled) { background-color: #0369a1; }
        .mae-btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

        .mae-btn-secondary { background-color: #334155; color: #f1f5f9; border: 1px solid #475569; }
        .mae-btn-secondary:hover:not(:disabled) { background-color: #475569; }

        /* MAE-B Compliance Active State (Global Button Scaling) */
        body.mae-b-scaled .mae-btn {
            min-height: 60px !important;
            font-size: 1.15rem !important;
            padding: 0 1.5rem !important;
            border-radius: 16px !important;
        }
        body.mae-b-scaled .compliance-badge {
            font-size: 0.85rem;
            padding: 0.5rem 1rem;
        }

        /* Consolidated Video Bar (1/3 Change Button + Trim Triggers) */
        .video-toolbar {
            display: flex;
            gap: 0.5rem;
            width: 100%;
            align-items: center;
        }

        .file-upload-wrapper {
            position: relative;
            flex: 0 0 33.333%; /* Exactly 1/3 width as requested */
            overflow: hidden;
            border-radius: 12px;
        }
        .file-upload-wrapper input[type="file"] {
            position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 10;
        }

        /* Version History Stack list */
        .version-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex: 1;
            overflow-y: auto;
        }

        .version-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            border: 1px solid #334155;
            padding: 0.65rem 0.85rem;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #e2e8f0;
        }

        .version-actions { display: flex; gap: 0.35rem; }
        .version-btn {
            background: #334155; border: none; color: #f1f5f9; cursor: pointer; font-size: 0.7rem; font-weight: 700; padding: 0.25rem 0.5rem; border-radius: 6px;
        }
        .version-btn:hover { background: #0284c7; }
        .version-btn.del:hover { background: #dc2626; }

        #actionStatus { font-size: 0.8rem; color: #38bdf8; font-weight: 600; text-align: center; display: none; }
    </style>
</head>
<body>

    <div class="studio-topbar">
        <header>
            <h1>Fig 60</h1>
            <p>MAE-B • Studio Video Engine</p>
        </header>
        <div class="topbar-actions">
            <button class="studio-btn" id="sampleClipBtn" title="Load High-Contrast Sample Clip">Load Sample Clip</button>
            <button class="studio-btn" id="resetLayoutBtn" title="Snap to Studio Default Layout">Reset Layout</button>
        </div>
    </div>

    <main class="workbench" id="workbenchCanvas">

        <!-- Container 1: Version History Stack -->
        <div class="floating-container" id="box-version-stack">
            <div class="container-header" data-target="box-version-stack">
                <span class="container-title">Version History Stack</span>
                <div class="container-controls">
                    <button class="icon-btn zoom-in-btn" title="Zoom In">+</button>
                    <button class="icon-btn zoom-out-btn" title="Zoom Out">-</button>
                    <span style="font-size:10px; color:#64748b;">⤢</span>
                </div>
            </div>
            <div class="container-body">
                <div id="versionListContainer" class="version-list">
                    <p style="font-size: 0.8rem; color: #64748b; text-align: center; padding: 1rem;">No versions saved yet.</p>
                </div>
            </div>
        </div>

        <!-- Container 2: Video Player & Consolidated Controls Workspace -->
        <div class="floating-container" id="box-video-player">
            <div class="container-header" data-target="box-video-player">
                <span class="container-title">Video Workspace & Trim</span>
                <div class="container-controls">
                    <button class="icon-btn zoom-in-btn" title="Zoom In">+</button>
                    <button class="icon-btn zoom-out-btn" title="Zoom Out">-</button>
                    <span style="font-size:10px; color:#64748b;">⤢</span>
                </div>
            </div>
            <div class="container-body">
                <div class="video-dropzone">
                    <p id="instructionText" style="font-size: 0.95rem; font-weight: 600; color: #cbd5e1;">Load Local Video or Sample</p>
                    <video id="videoPlayer" controls playsinline preload="auto"></video>
                    <span id="fileStatus" style="font-size: 0.8rem; color: #34d399; font-weight: 600; display: none;"></span>
                    <span class="compliance-badge" id="maeComplianceToggle" title="Tap to Toggle Button Accessibility Scale">MAE-B Compliance Active</span>
                </div>

                <!-- Consolidated Toolbar: 1/3 Change Video button + Start/End triggers -->
                <div class="video-toolbar">
                    <div class="file-upload-wrapper">
                        <button class="mae-btn mae-btn-secondary" id="selectButton" style="width: 100%; font-size: 0.85rem;">Change</button>
                        <input type="file" id="fileInput" accept="video/mp4,video/quicktime,video/*">
                    </div>
                    <button class="mae-btn mae-btn-secondary" id="setStartBtn" style="flex: 1; font-size: 0.85rem;" disabled>Set Start</button>
                    <button class="mae-btn mae-btn-secondary" id="setEndBtn" style="flex: 1; font-size: 0.85rem;" disabled>Set End</button>
                </div>
            </div>
        </div>

        <!-- Container 3: Editing Actions -->
        <div class="floating-container" id="box-actions">
            <div class="container-header" data-target="box-actions">
                <span class="container-title">Editing Actions</span>
                <div class="container-controls">
                    <button class="icon-btn zoom-in-btn" title="Zoom In">+</button>
                    <button class="icon-btn zoom-out-btn" title="Zoom Out">-</button>
                    <span style="font-size:10px; color:#64748b;">⤢</span>
                </div>
            </div>
            <div class="container-body" style="justify-content: center; gap: 1rem;">
                <button class="mae-btn" id="saveVersionBtn" disabled>Save as New Version</button>
                <span id="actionStatus"></span>
                <p style="font-size: 0.75rem; color: #64748b; text-align: center;">Shortcuts: [Space] Play, [I] Start, [O] End, [S] Save</p>
            </div>
        </div>

    </main>

    <script>
        const workbenchCanvas = document.getElementById('workbenchCanvas');
        const fileInput = document.getElementById('fileInput');
        const fileStatus = document.getElementById('fileStatus');
        const instructionText = document.getElementById('instructionText');
        const selectButton = document.getElementById('selectButton');
        const videoPlayer = document.getElementById('videoPlayer');

        const setStartBtn = document.getElementById('setStartBtn');
        const setEndBtn = document.getElementById('setEndBtn');
        const saveVersionBtn = document.getElementById('saveVersionBtn');
        const actionStatus = document.getElementById('actionStatus');
        const versionListContainer = document.getElementById('versionListContainer');
        const maeComplianceToggle = document.getElementById('maeComplianceToggle');
        const resetLayoutBtn = document.getElementById('resetLayoutBtn');
        const sampleClipBtn = document.getElementById('sampleClipBtn');

        let startTime = 0;
        let endTime = 0;
        let versions = [];
        let zoomLevels = { 'box-version-stack': 1, 'box-video-player': 1, 'box-actions': 1 };

        // 1. Session Persistence & Default Layout Setup
        const defaultPositions = {
            'box-version-stack': { top: '20px', left: '20px', width: '320px', height: '420px' },
            'box-video-player':  { top: '20px', left: '360px', width: '520px', height: '500px' },
            'box-actions':       { top: '460px', left: '20px', width: '380px', height: '260px' }
        };

        function loadSavedLayout() {
            const saved = localStorage.getItem('fig60_layout');
            if (saved) {
                try {
                    const pos = JSON.parse(saved);
                    for (const id in pos) {
                        const el = document.getElementById(id);
                        if (el && pos[id]) {
                            el.style.top = pos[id].top;
                            el.style.left = pos[id].left;
                            el.style.width = pos[id].width;
                            el.style.height = pos[id].height;
                        }
                    }
                } catch (e) { resetLayout(); }
            }
        }

        function saveLayout() {
            const pos = {};
            document.querySelectorAll('.floating-container').forEach(el => {
                pos[el.id] = { top: el.style.top, left: el.style.left, width: el.style.width, height: el.style.height };
            });
            localStorage.setItem('fig60_layout', JSON.stringify(pos));
        }

        function resetLayout() {
            for (const id in defaultPositions) {
                const el = document.getElementById(id);
                if (el) {
                    el.style.top = defaultPositions[id].top;
                    el.style.left = defaultPositions[id].left;
                    el.style.width = defaultPositions[id].width;
                    el.style.height = defaultPositions[id].height;
                    zoomLevels[id] = 1;
                    el.style.transform = 'scale(1)';
                }
            }
            localStorage.removeItem('fig60_layout');
        }
        resetLayoutBtn.addEventListener('click', resetLayout);

        // 2. Free-Floating Desktop Dragging & Focus Mode
        document.querySelectorAll('.container-header').forEach(header => {
            const containerId = header.getAttribute('data-target');
            const container = document.getElementById(containerId);

            header.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.icon-btn')) return; // Ignore zoom buttons
                e.preventDefault();
                container.classList.add('focused');
                workbenchCanvas.classList.add('focus-active');

                const rect = container.getBoundingClientRect();
                const offsetX = e.clientX - rect.left;
                const offsetY = e.clientY - rect.top;

                function onPointerMove(pe) {
                    const canvasRect = workbenchCanvas.getBoundingClientRect();
                    let newX = pe.clientX - canvasRect.left - offsetX;
                    let newY = pe.clientY - canvasRect.top - offsetY;
                    container.style.left = `${Math.max(0, newX)}px`;
                    container.style.top = `${Math.max(0, newY)}px`;
                }

                function onPointerUp() {
                    container.classList.remove('focused');
                    workbenchCanvas.classList.remove('focus-active');
                    window.removeEventListener('pointermove', onPointerMove);
                    window.removeEventListener('pointerup', onPointerUp);
                    saveLayout();
                }

                window.addEventListener('pointermove', onPointerMove);
                window.addEventListener('pointerup', onPointerUp);
            });
        });

        // 3. Container Zoom & Focus Mode
        document.querySelectorAll('.floating-container').forEach(container => {
            const id = container.id;
            const zoomIn = container.querySelector('.zoom-in-btn');
            const zoomOut = container.querySelector('.zoom-out-btn');

            container.addEventListener('mouseenter', () => {
                workbenchCanvas.classList.add('focus-active');
                container.classList.add('focused');
            });
            container.addEventListener('mouseleave', () => {
                workbenchCanvas.classList.remove('focus-active');
                container.classList.remove('focused');
            });

            zoomIn.addEventListener('click', () => {
                zoomLevels[id] = Math.min(zoomLevels[id] + 0.1, 1.5);
                container.style.transform = `scale(${zoomLevels[id]})`;
            });
            zoomOut.addEventListener('click', () => {
                zoomLevels[id] = Math.max(zoomLevels[id] - 0.1, 0.75);
                container.style.transform = `scale(${zoomLevels[id]})`;
            });
        });

        // 4. MAE-B Global Button Scaling Toggle
        maeComplianceToggle.addEventListener('click', () => {
            document.body.classList.toggle('mae-b-scaled');
            const active = document.body.classList.contains('mae-b-scaled');
            maeComplianceToggle.textContent = active ? "MAE-B Scale Active (Enlarged)" : "MAE-B Compliance Active";
        });

        // 5. High-Contrast Sample Video Sandbox
        sampleClipBtn.addEventListener('click', () => {
            // High-contrast public test MP4
            const sampleURL = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4";
            initVideo(sampleURL, "Sample High-Contrast Clip");
        });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = (seconds % 60).toFixed(1);
            return `${mins.toString().padStart(2, '0')}:${secs.padStart(4, '0')}`;
        }

        function renderVersionList() {
            if (versions.length === 0) {
                versionListContainer.innerHTML = `<p style="font-size: 0.8rem; color: #64748b; text-align: center; padding: 1rem;">No versions saved yet.</p>`;
                return;
            }

            versionListContainer.innerHTML = '';
            versions.forEach((ver, index) => {
                const label = index === 0 ? "Original" : `Version ${index}`;
                const item = document.createElement('div');
                item.className = 'version-item';
                item.innerHTML = `
                    <span>${label}</span>
                    <div class="version-actions">
                        <button class="version-btn" onclick="loadVersion(${index})">Load</button>
                        <button class="version-btn" onclick="downloadVersion(${index})">Save</button>
                        ${index > 0 ? `<button class="version-btn del" onclick="deleteVersion(${index})">Del</button>` : ''}
                    </div>
                `;
                versionListContainer.appendChild(item);
            });
        }

        function initVideo(url, name) {
            versions = [{ name: "Original", url: url, range: null }];
            videoPlayer.src = url;
            videoPlayer.style.display = 'block';
            videoPlayer.load();

            instructionText.style.display = 'none';
            fileStatus.textContent = `Loaded: ${name}`;
            fileStatus.style.display = 'block';
            selectButton.textContent = "Change";

            setStartBtn.disabled = false;
            setEndBtn.disabled = false;
            saveVersionBtn.disabled = false;
            actionStatus.style.display = 'none';

            renderVersionList();
        }

        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const videoURL = URL.createObjectURL(file);
                initVideo(videoURL, file.name);
            }
        });

        setStartBtn.addEventListener('click', () => {
            startTime = videoPlayer.currentTime;
            setStartBtn.textContent = `Start: ${formatTime(startTime)}`;
            actionStatus.textContent = `Start point set at ${formatTime(startTime)}`;
            actionStatus.style.display = 'block';
        });

        setEndBtn.addEventListener('click', () => {
            endTime = videoPlayer.currentTime;
            setEndBtn.textContent = `End: ${formatTime(endTime)}`;
            actionStatus.textContent = `End point set at ${formatTime(endTime)}`;
            actionStatus.style.display = 'block';
        });

        saveVersionBtn.addEventListener('click', () => {
            if (versions.length === 0) return;
            const editCount = versions.length;
            const verName = `Version ${editCount}`;

            versions.push({
                name: verName,
                url: videoPlayer.src,
                range: { start: startTime, end: endTime > startTime ? endTime : videoPlayer.duration }
            });

            renderVersionList();
            actionStatus.textContent = `Successfully saved "${verName}" to history stack!`;
            actionStatus.style.display = 'block';
        });

        window.loadVersion = function(index) {
            const ver = versions[index];
            videoPlayer.src = ver.url;
            videoPlayer.load();
            if (ver.range) {
                videoPlayer.currentTime = ver.range.start;
                videoPlayer.play();
                // Simple segment boundary checker
                const checkTime = () => {
                    if (videoPlayer.currentTime >= ver.range.end) {
                        videoPlayer.pause();
                        videoPlayer.removeEventListener('timeupdate', checkTime);
                    }
                };
                videoPlayer.addEventListener('timeupdate', checkTime);
            }
            actionStatus.textContent = `Loaded "${ver.name}" into player.`;
            actionStatus.style.display = 'block';
        };

        window.downloadVersion = function(index) {
            const ver = versions[index];
            const a = document.createElement('a');
            a.href = ver.url;
            a.download = `${ver.name.toLowerCase().replace(/\s+/g, '-')}.mp4`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };

        window.deleteVersion = function(index) {
            if (index === 0) return;
            versions.splice(index, 1);
            renderVersionList();
            actionStatus.textContent = `Deleted version.`;
            actionStatus.style.display = 'block';
        };

        // 6. Power-User Keyboard Shortcuts
        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === 'Space') {
                e.preventDefault();
                if (videoPlayer.paused) videoPlayer.play();
                else videoPlayer.pause();
            } else if (e.code === 'KeyI' && !setStartBtn.disabled) {
                setStartBtn.click();
            } else if (e.code === 'KeyO' && !setEndBtn.disabled) {
                setEndBtn.click();
            } else if (e.code === 'KeyS' && !saveVersionBtn.disabled) {
                saveVersionBtn.click();
            }
        });

        // Initialize saved positions on load
        loadSavedLayout();
    </script>
</body>
</html>

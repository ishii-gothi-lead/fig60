<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fig 60 - MAE-B Prototype</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #00e676;
      --accent-active: #00b359;
      --text-main: #ffffff;
      --text-sub: #b0b0b0;
      --min-touch-size: 56px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 12px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      text-align: center;
      padding: 8px 0;
    }

    header h1 {
      font-size: 1.5rem;
      letter-spacing: 0.5px;
    }

    header p {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .video-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .video-preview {
      width: 100%;
      aspect-ratio: 9 / 16;
      max-height: 320px;
      background-color: #000;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-sub);
      font-size: 1rem;
      border: 2px dashed #333;
    }

    .primary-btn {
      width: 100%;
      min-height: var(--min-touch-size);
      background-color: var(--accent-color);
      color: #000;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .control-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .control-card h2 {
      font-size: 1.1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .time-badge {
      font-size: 1.1rem;
      font-family: monospace;
      color: var(--accent-color);
      background: #000;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .btn-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .action-btn {
      min-height: var(--min-touch-size);
      background-color: #2a2a2a;
      color: var(--text-main);
      border: 2px solid #444;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .mark-btn {
      grid-column: span 2;
      background-color: #2a3a2a;
      border-color: var(--accent-color);
      color: var(--accent-color);
    }

    .toggle-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .toggle-btn {
      min-height: var(--min-touch-size);
      background-color: #2a2a2a;
      border: 2px solid #444;
      border-radius: 8px;
      color: var(--text-main);
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .toggle-btn.active {
      border-color: var(--accent-color);
      background-color: #1a2e22;
    }

    .export-btn {
      width: 100%;
      min-height: 64px;
      background-color: var(--accent-color);
      color: #000;
      font-size: 1.25rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Fig 60</h1>
      <p>Powered by MAE-B (Motor-Accessible Editing)</p>
    </header>

    <div class="video-card">
      <div class="video-preview">
        <span>MAE-B Video Preview</span>
      </div>
      <button class="primary-btn">▶ Play / Pause</button>
    </div>

    <div class="control-card">
      <h2>Start Time <span class="time-badge" id="startTime">00:00.0</span></h2>
      <div class="btn-row">
        <button class="action-btn mark-btn" onclick="setMarker('start')">📍 Mark Start</button>
        <button class="action-btn" onclick="adjustTime('start', -0.5)">-0.5s</button>
        <button class="action-btn" onclick="adjustTime('start', 0.5)">+0.5s</button>
      </div>
    </div>

    <div class="control-card">
      <h2>End Time <span class="time-badge" id="endTime">01:00.0</span></h2>
      <div class="btn-row">
        <button class="action-btn mark-btn" onclick="setMarker('end')">🏁 Mark End</button>
        <button class="action-btn" onclick="adjustTime('end', -0.5)">-0.5s</button>
        <button class="action-btn" onclick="adjustTime('end', 0.5)">+0.5s</button>
      </div>
    </div>

    <div class="toggle-group">
      <button class="toggle-btn" id="muteBtn" onclick="toggleMute()">🔊 Sound On</button>
      <button class="toggle-btn active" id="ratioBtn" onclick="toggleRatio()">📱 9:16 Crop</button>
    </div>

    <button class="export-btn" onclick="processVideo()">⚡ Process Micro-Video</button>
  </div>

  <script>
    let startVal = 0.0;
    let endVal = 60.0;
    let isMuted = false;
    let isVertical = true;

    function setMarker(type) {
      if (type === 'start') {
        startVal += 1.0;
        document.getElementById('startTime').textContent = formatTime(startVal);
      } else {
        endVal -= 1.0;
        document.getElementById('endTime').textContent = formatTime(endVal);
      }
    }

    function adjustTime(type, amount) {
      if (type === 'start') {
        startVal = Math.max(0, startVal + amount);
        document.getElementById('startTime').textContent = formatTime(startVal);
      } else {
        endVal = Math.min(60.0, Math.max(startVal + 0.5, endVal + amount));
        document.getElementById('endTime').textContent = formatTime(endVal);
      }
    }

    function toggleMute() {
      isMuted = !isMuted;
      const btn = document.getElementById('muteBtn');
      btn.textContent = isMuted ? "🔇 Muted" : "🔊 Sound On";
      btn.classList.toggle('active', isMuted);
    }

    function toggleRatio() {
      isVertical = !isVertical;
      const btn = document.getElementById('ratioBtn');
      btn.textContent = isVertical ? "📱 9:16 Crop" : "📺 16:9 Wide";
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
      const secs = (seconds % 60).toFixed(1).padStart(4, '0');
      return `${mins}:${secs}`;
    }

    function processVideo() {
      alert(`MAE-B Engine: Processing local micro-video from ${formatTime(startVal)} to ${formatTime(endVal)}.`);
    }
  </script>
</body>
</html>

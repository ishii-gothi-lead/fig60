<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fig 60 Studio</title>
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-muted: #64748b;
            --primary: #0284c7;
            --drawer-bg: #0f172a;
            --drawer-text: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 20px 24px 12px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .brand h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.05em;
            line-height: 1;
        }

        .brand p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 500;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .engine-pill {
            background: var(--drawer-bg);
            color: var(--drawer-text);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 4px;
            letter-spacing: 0.05em;
        }

        .lang-toggle {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            font-weight: 700;
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        main {
            flex: 1;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }

        .workspace-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .workspace-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .workspace-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--text-muted);
        }

        .sample-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            background: #e0f2fe;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .video-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .timecode-display {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background: #f1f5f9;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }

        .tc-box label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        .tc-box span {
            font-size: 15px;
            font-weight: 700;
            color: var(--primary);
            font-variant-numeric: tabular-nums;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button.btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button.btn:active {
            transform: scale(0.98);
        }

        button.btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
            grid-column: span 2;
        }

        /* Relocatable Drawer */
        .drawer-handle {
            position: fixed;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            width: 14px;
            height: 56px;
            background: var(--drawer-bg);
            border-top-right-radius: 8px;
            border-bottom-right-radius: 8px;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 2px 0 8px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        .drawer-handle::after {
            content: "";
            width: 4px;
            height: 24px;
            background: #ffffff55;
            border-radius: 2px;
        }

        .drawer-panel {
            position: fixed;
            top: 0;
            left: -320px;
            width: 300px;
            height: 100vh;
            background: var(--surface);
            border-right: 1px solid var(--border);
            box-shadow: 10px 0 30px rgba(0,0,0,0.1);
            z-index: 1001;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            padding: 24px 20px;
            gap: 20px;
        }

        .drawer-panel.open {
            transform: translateX(320px);
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .drawer-header h2 {
            font-size: 16px;
            font-weight: 700;
        }

        .close-drawer {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .pockets-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .pocket-dropdown {
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .pocket-summary {
            padding: 10px 14px;
            background: #f8fafc;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pocket-content {
            padding: 10px 14px;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            background: #fff;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1 id="app-title">Fig 60</h1>
            <p id="app-tagline">Raw fidelity, simplified editing.</p>
        </div>
        <div class="header-controls">
            <div class="engine-pill">MAE-B</div>
            <button class="lang-toggle" id="langToggle" onclick="toggleLang()">ESP</button>
        </div>
    </header>

    <main>
        <div class="workspace-card">
            <div class="workspace-header">
                <span class="workspace-title" id="ws-label">VIDEO WORKSPACE & TRIM</span>
                <div class="sample-selector" onclick="loadSample()">
                    <span id="sample-name">Big Buck Bunny (Sample)</span>
                </div>
            </div>

            <div class="video-container">
                <video id="videoPlayer" controls playsinline preload="metadata">
                    <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
                    Your browser does not support video playback.
                </video>
            </div>

            <div class="timecode-display">
                <div class="tc-box">
                    <label>IN</label>
                    <span id="tc-in">00:00.00</span>
                </div>
                <div class="tc-box">
                    <label>OUT</label>
                    <span id="tc-out">00:00.00</span>
                </div>
                <div class="tc-box">
                    <label>DUR</label>
                    <span id="tc-dur">00:00.00</span>
                </div>
            </div>

            <div class="action-grid">
                <button class="btn" onclick="changeClip()" id="btn-change">Change Clip</button>
                <button class="btn" onclick="setStart()" id="btn-start">Set Start [I]</button>
                <button class="btn" onclick="setEnd()" id="btn-end">Set End [O]</button>
                <button class="btn btn-primary" onclick="saveVersion()" id="btn-save">Save Version</button>
            </div>
        </div>
    </main>

    <!-- Drawer Handle & Panel -->
    <div class="drawer-handle" id="drawerHandle"></div>
    
    <div class="drawer-panel" id="drawerPanel">
        <div class="drawer-header">
            <h2 id="drawer-title">Pocketed Versions</h2>
            <button class="close-drawer" onclick="toggleDrawer()">×</button>
        </div>
        <div class="pockets-list" id="pocketsList">
            <div class="pocket-dropdown">
                <div class="pocket-summary" onclick="togglePocket(this)">
                    <span>Version 01 — Rough Cut</span>
                    <span>▾</span>
                </div>
                <div class="pocket-content" style="display: none;">
                    In: 00:02.10 | Out: 00:15.00<br>Saved locally to storage.
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentLang = localStorage.getItem('fig60_lang') || 'EN';
        
        const translations = {
            EN: {
                tagline: "Raw fidelity, simplified editing.",
                wsLabel: "VIDEO WORKSPACE & TRIM",
                sampleName: "Big Buck Bunny (Sample)",
                changeClip: "Change Clip",
                setStart: "Set Start [I]",
                setEnd: "Set End [O]",
                saveVersion: "Save Version",
                drawerTitle: "Pocketed Versions",
                langToggle: "ESP"
            },
            ES: {
                tagline: "Fidelidad pura, edición simplificada.",
                wsLabel: "ESPACIO DE VIDEO Y CORTE",
                sampleName: "Big Buck Bunny (Muestra)",
                changeClip: "Cambiar Clip",
                setStart: "Marcar Inicio [I]",
                setEnd: "Marcar Fin [O]",
                saveVersion: "Guardar Versión",
                drawerTitle: "Versiones Guardadas",
                langToggle: "ENG"
            }
        };

        function updateLanguage() {
            const t = translations[currentLang === 'EN' ? 'EN' : 'ES'];
            document.getElementById('app-tagline').innerText = t.tagline;
            document.getElementById('ws-label').innerText = t.wsLabel;
            document.getElementById('sample-name').innerText = t.sampleName;
            document.getElementById('btn-change').innerText = t.changeClip;
            document.getElementById('btn-start').innerText = t.setStart;
            document.getElementById('btn-end').innerText = t.setEnd;
            document.getElementById('btn-save').innerText = t.saveVersion;
            document.getElementById('drawer-title').innerText = t.drawerTitle;
            document.getElementById('langToggle').innerText = t.langToggle;
        }

        function toggleLang() {
            currentLang = currentLang === 'EN' ? 'ES' : 'EN';
            localStorage.setItem('fig60_lang', currentLang);
            updateLanguage();
        }

        // Drawer logic
        const handle = document.getElementById('drawerHandle');
        const panel = document.getElementById('drawerPanel');

        handle.addEventListener('click', () => {
            panel.classList.toggle('open');
        });

        function toggleDrawer() {
            panel.classList.remove('open');
        }

        function togglePocket(el) {
            const content = el.nextElementSibling;
            content.style.display = content.style.display === 'none' ? 'block' : 'none';
        }

        // Video controls stubs
        const video = document.getElementById('videoPlayer');
        function setStart() {
            document.getElementById('tc-in').innerText = formatTime(video.currentTime);
        }
        function setEnd() {
            document.getElementById('tc-out').innerText = formatTime(video.currentTime);
        }
        function formatTime(sec) {
            let m = Math.floor(sec / 60);
            let s = (sec % 60).toFixed(2);
            return `${m.toString().padStart(2,'0')}:${s < 10 ? '0' : ''}${s}`;
        }
        function changeClip() {
            alert("Select local or remote video source.");
        }
        function saveVersion() {
            alert("Version pocketed securely to local storage.");
        }

        updateLanguage();
    </script>
</body>
</html>
